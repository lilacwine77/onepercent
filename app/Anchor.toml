[provider]
cluster = "localnet"
wallet = ".anchor/localnet-wallet.json"

[scripts]
test = "node --preserve-symlinks scripts/test.mjs --config vitest.program.config.ts"

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
rpc_port = 8899
