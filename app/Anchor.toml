[toolchain]
anchor_version = "0.32.2"
solana_version = "4.3.0"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
onepercent = "DoNH1Cxvv9umyWV9i77LEK4CoqTotDxPRzPxPBzjMJpe"

[programs.devnet]
onepercent = "DzMTD92EwiEaZ5uTKPwweR2JEhp62kp8VEmpueCAQigr"

# BEGIN GENERATED MAINNET IDENTITY
# PENDING: run release:mainnet:apply with public release input.
