[package]
name = "mock-vrf"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[lib]
crate-type = ["cdylib", "lib"]
name = "mock_vrf"
[dependencies]
solana-program = "=2.3.0"
borsh = "=0.10.4"
[features]
custom-heap = []
custom-panic = []
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
