services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: onepercent
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: onepercent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onepercent -d onepercent"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-data:
